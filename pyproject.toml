[project]
name = "pyrightmcp"
version = "0.1.0"
description = "FastMCP server for running pyright language server"
authors = [{ name = "Assistant", email = "assistant@example.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyright>=1.1.401",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
]
lsp = [
    "python-lsp-jsonrpc>=1.1.0",
]

[project.scripts]
pyrightmcp = "pyrightmcp.main:app"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "e2e: marks tests as end-to-end (slow, requires real LSP)",
    "slow: marks tests as slow running",
    "integration: marks tests as integration tests",
    "requires_lsp: marks tests that need LSP dependencies"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
